name: Qodana

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: qodana-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --use-system-ca

jobs:
  register:
    name: Resolve Qodana source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact_name: ${{ steps.source.outputs.artifact_name }}
      base_ref: ${{ steps.source.outputs.base_ref }}
      head_repository: ${{ steps.source.outputs.head_repository }}
      head_sha: ${{ steps.source.outputs.head_sha }}
      merge_base_sha: ${{ steps.source.outputs.merge_base_sha }}
      pull_number: ${{ steps.source.outputs.pull_number }}
      source_kind: ${{ steps.source.outputs.source_kind }}
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install CI tooling dependencies
        working-directory: .github
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build CI tooling
        working-directory: .github
        run: npm run build

      - name: Resolve the pull-request source
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          QODANA_RUN_ID: ${{ github.run_id }}
          QODANA_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { resolvePullRequestEventSource } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/qodana-source.js`);
            const source = await resolvePullRequestEventSource({
              github,
              context,
              qodanaRunId: Number(process.env.QODANA_RUN_ID),
              qodanaRunAttempt: Number(process.env.QODANA_RUN_ATTEMPT),
            });
            core.setOutput('source_kind', source.sourceKind);
            core.setOutput('artifact_name', source.artifactName);
            core.setOutput('pull_number', String(source.pullRequest));
            core.setOutput('head_repository', source.headRepository);
            core.setOutput('head_sha', source.headSha);
            core.setOutput('base_ref', source.baseRef);
            core.setOutput('merge_base_sha', source.mergeBaseSha || '');

  analyse:
    name: Qodana analysis
    needs: register
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout pull-request code
        if: needs.register.outputs.source_kind == 'code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.register.outputs.head_repository }}
          ref: ${{ needs.register.outputs.head_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the pull-request checkout
        if: needs.register.outputs.source_kind == 'code'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.register.outputs.head_sha }}
        run: |
          set -euo pipefail
          actual_head_sha="$(git -C source rev-parse HEAD)"
          if [[ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "The pull-request head changed after source validation." >&2
            exit 1
          fi

      - name: Apply the trusted Qodana configuration
        if: needs.register.outputs.source_kind == 'code'
        shell: bash
        run: cp --remove-destination -- qodana.yaml source/qodana.yaml

      - name: Restore Gradle caches for the linter
        if: needs.register.outputs.source_kind == 'code'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Restore the Qodana IDE distribution
        if: needs.register.outputs.source_kind == 'code'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qodana
          key: qodana-ide-${{ runner.os }}-v2026.2.0

      - name: Scan pull-request code with Qodana
        if: needs.register.outputs.source_kind == 'code'
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          args: >-
            --project-dir source
            --config qodana.yaml
          github-token: ${{ github.token }}
          pr-mode: true
          upload-result: false
          use-annotations: false
          post-pr-comment: false
          push-fixes: none
          cache-dir: ${{ runner.temp }}/qodana/cache/analysis
          use-caches: true
        env:
          QODANA_PR_SHA: ${{ needs.register.outputs.merge_base_sha }}
          QODANA_REVISION: ${{ needs.register.outputs.head_sha }}

      - name: Upload Qodana scan result
        if: success() && needs.register.outputs.source_kind == 'code'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.register.outputs.artifact_name }}
          path: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          if-no-files-found: error
          retention-days: 7

  attestation:
    name: Trusted QDJVM attestation
    needs: register
    if: needs.register.outputs.source_kind != 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install CI tooling dependencies
        working-directory: .github
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build CI tooling
        working-directory: .github
        run: npm run build

      - name: Create trusted QDJVM attestation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_KIND: ${{ needs.register.outputs.source_kind }}
          HEAD_SHA: ${{ needs.register.outputs.head_sha }}
          OUTPUT_PATH: ${{ runner.temp }}/qodana-attestation/qodana.sarif.json
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { writeAttestation } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/qodana-attestation.js`);
            writeAttestation({
              sourceKind: process.env.SOURCE_KIND,
              headSha: process.env.HEAD_SHA,
              outputPath: process.env.OUTPUT_PATH,
            });

      - name: Upload trusted QDJVM attestation
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.register.outputs.artifact_name }}
          path: ${{ runner.temp }}/qodana-attestation/qodana.sarif.json
          if-no-files-found: error
          retention-days: 7
