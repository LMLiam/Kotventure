name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  merge_group:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      tasks:
        description: Gradle tasks (space-separated). Empty uses the default CI task set, or :module:build when module is set.
        required: false
        default: ''
        type: string
      module:
        description: Optional Gradle project name (e.g. core, minimessage). Empty runs the full multi-project default.
        required: false
        default: ''
        type: string

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  triage:
    name: Triage
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      release_only: ${{ steps.decide.outputs.release_only }}
      release_candidate: ${{ steps.decide.outputs.release_candidate }}
      documentation_only: ${{ steps.decide.outputs.documentation_only }}
      code: ${{ steps.resolve.outputs.code }}
      vanilla: ${{ steps.resolve.outputs.vanilla }}
      docs_only: ${{ steps.resolve.outputs.documentation_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install CI tooling dependencies
        working-directory: .github
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build CI tooling
        working-directory: .github
        run: npm run build

      - name: Decide whether heavy CI should run
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { decideGate } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-gate.js`);
            await decideGate({ github, context, core });

      - name: Path filter
        id: filter
        if: >-
          steps.decide.outputs.run == 'true' &&
          (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'modules/**'
              - 'gradle/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'buildSrc/**'
              - '.editorconfig'
              - '.gitattributes'
              - '.gitignore'
              - 'qodana.yaml'
              - 'jitpack.yml'
              - 'release-please-config.json'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/dependabot.yml'
              - '.github/package.json'
              - '.github/package-lock.json'
              - '.github/tsconfig*.json'
            vanilla:
              - 'modules/core/**'
              - 'gradle/vanilla-conformance.gradle'
              - 'buildSrc/**'
              - '.github/scripts/vanilla-fixture-cache-key.sh'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-jdk-gradle/**'

      - name: Resolve flags
        id: resolve
        if: steps.decide.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          FILTER_VANILLA: ${{ steps.filter.outputs.vanilla }}
          RELEASE_CANDIDATE: ${{ steps.decide.outputs.release_candidate }}
          DOCUMENTATION_ONLY: ${{ steps.decide.outputs.documentation_only }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$RELEASE_CANDIDATE" == "true" ]]; then
            {
              echo "code=true"
              echo "vanilla=true"
              echo "documentation_only=false"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$DOCUMENTATION_ONLY" == "true" ]]; then
              {
                echo "code=false"
                echo "vanilla=false"
                echo "documentation_only=true"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "code=true"
                echo "vanilla=${FILTER_VANILLA}"
                echo "documentation_only=false"
              } >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            {
              echo "code=${FILTER_CODE}"
              echo "vanilla=${FILTER_VANILLA}"
              echo "documentation_only=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "code=true"
              echo "vanilla=true"
              echo "documentation_only=false"
            } >> "$GITHUB_OUTPUT"
          fi

  lint-kotlin:
    name: Lint (Kotlin)
    needs: [triage]
    if: needs.triage.outputs.run == 'true' && needs.triage.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run linters
        uses: ./.github/actions/gradle-job
        with:
          tasks: spotlessCheck ktlintCheck
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  lint-actions:
    name: Lint (Actions)
    needs: [triage]
    if: needs.triage.outputs.run == 'true' && needs.triage.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install CI tooling dependencies
        working-directory: .github
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build CI tooling
        working-directory: .github
        run: npm run build

      - name: Check one type declaration per file
        run: bash .github/scripts/check-one-declaration-per-file.sh

      - name: Test pr-metrics-comment action
        run: node --test .github/actions/pr-metrics-comment/test/*.test.js .github/scripts/*.test.js

      - name: Verify generated JavaScript is not tracked
        run: |
          if git ls-files '.github/scripts/**/*.js' '.github/actions/pr-metrics-comment/**/*.js' | grep -q .; then
            echo "Generated JavaScript must not be tracked." >&2
            exit 1
          fi
          git check-ignore -q .github/scripts/ci-gate.js && echo "ignored ok"

  build:
    name: Build (${{ matrix.shard }})
    needs: [triage]
    if: needs.triage.outputs.run == 'true' && needs.triage.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            tasks: :core:koverBinaryReport :core:jar
          - shard: text
            tasks: :minimessage:koverBinaryReport :serializer:koverBinaryReport :minimessage:jar :serializer:jar
          - shard: runtime
            tasks: :coroutines:koverBinaryReport :paper:koverBinaryReport :test:koverBinaryReport :test-snapshot:koverBinaryReport :bom:build :coroutines:jar :paper:jar :test:jar :test-snapshot:jar
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve Gradle tasks
        id: tasks
        env:
          INPUT_TASKS: ${{ github.event.inputs.tasks || '' }}
          INPUT_MODULE: ${{ github.event.inputs.module || '' }}
          MATRIX_TASKS: ${{ matrix.tasks }}
        run: |
          set -euo pipefail
          tasks="${INPUT_TASKS#"${INPUT_TASKS%%[![:space:]]*}"}"
          tasks="${tasks%"${tasks##*[![:space:]]}"}"
          module="${INPUT_MODULE#"${INPUT_MODULE%%[![:space:]]*}"}"
          module="${module%"${module##*[![:space:]]}"}"

          if [[ -n "$module" && ! "$module" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Invalid module name: $module" >&2
            exit 1
          fi

          if [[ -n "$tasks" ]]; then
            echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
            echo "Resolved Gradle tasks: $tasks (from input)"
          elif [[ -n "$module" ]]; then
            tasks=":${module}:build :koverVerify verifyBomConsumerVersionlessDependencies verifyReleaseVersionConsistency :koverXmlReport :koverHtmlReport dokkaGenerate"
            echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
            echo "Resolved Gradle tasks: $tasks (from module)"
          else
            tasks="${{ matrix.tasks }}"
            echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
            echo "Resolved Gradle tasks: $tasks (from matrix shard ${{ matrix.shard }})"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run build
        uses: ./.github/actions/gradle-job
        with:
          tasks: ${{ steps.tasks.outputs.tasks }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Stage XML-only JUnit hand-off
        if: always()
        run: |
          set -euo pipefail
          rm -rf junit-handoff
          while IFS= read -r report; do
            target="junit-handoff/$report"
            mkdir -p "$(dirname "$target")"
            cp "$report" "$target"
          done < <(find modules -type f -path '*/build/test-results/test/TEST-*.xml' -print)

      - name: Resolve CI workflow identity
        id: workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.workflow_id')"
          [[ "$workflow_id" =~ ^[0-9]+$ ]]
          echo "workflow_id=$workflow_id" >> "$GITHUB_OUTPUT"

      - name: Upload XML-only JUnit hand-off
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-build-${{ matrix.shard }}-${{ steps.workflow.outputs.workflow_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: junit-handoff
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-test-results-${{ matrix.shard }}
          path: |
            modules/*/build/test-results/test
            modules/*/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage Kover hand-off
        if: always()
        run: |
          set -euo pipefail
          rm -rf kover-handoff
          for module in modules/*; do
            [ -d "$module/build/kover" ] || continue
            name=$(basename "$module")
            dir="kover-handoff/$name"
            mkdir -p "$dir"
            cp "$module/build/kover/jvm.artifact" "$dir/" 2>/dev/null || true
            cp -R "$module/build/kover/bin-reports" "$dir/" 2>/dev/null || true
            cp -R "$module/build/classes/kotlin/main" "$dir/classes-kotlin-main" 2>/dev/null || true
            cp -R "$module/build/classes/java/main" "$dir/classes-java-main" 2>/dev/null || true
            cp -R "$module/build/classes/kotlin/vanillaConformanceTest" "$dir/classes-kotlin-vanillaConformanceTest" 2>/dev/null || true
            cp -R "$module/build/classes/java/vanillaConformanceTest" "$dir/classes-java-vanillaConformanceTest" 2>/dev/null || true
          done

      - name: Upload Kover hand-off
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kover-handoff-${{ matrix.shard }}
          path: kover-handoff
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload module jars
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-jars-${{ matrix.shard }}
          path: build/libs/kotventure-*.jar
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare duration artifact
        if: always()
        run: |
          set -euo pipefail
          if [[ -f gradle-duration.txt ]]; then
            cp gradle-duration.txt gradle-duration-${{ matrix.shard }}.txt
          else
            echo "0" > gradle-duration-${{ matrix.shard }}.txt
          fi

      - name: Upload duration
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-duration-${{ matrix.shard }}
          path: gradle-duration-${{ matrix.shard }}.txt
          if-no-files-found: ignore
          retention-days: 7


  aggregate:
    name: Aggregate
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gradle-test-results-*
          path: .
          merge-multiple: true

      - name: Download Kover hand-off
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kover-handoff-*
          path: kover-handoff
          merge-multiple: true

      - name: Restore Kover data layout
        run: |
          set -euo pipefail
          for module in kover-handoff/*; do
            [ -d "$module" ] || continue
            name=$(basename "$module")
            mkdir -p "modules/$name/build/kover/bin-reports" \
              "modules/$name/build/classes/kotlin" \
              "modules/$name/build/classes/java"
            cp "$module/jvm.artifact" "modules/$name/build/kover/jvm.artifact"
            if [ -d "$module/bin-reports" ]; then
              cp -R "$module/bin-reports/." "modules/$name/build/kover/bin-reports/"
            fi
            if [ -d "$module/classes-kotlin-main" ]; then
              mkdir -p "modules/$name/build/classes/kotlin/main"
              cp -R "$module/classes-kotlin-main/." "modules/$name/build/classes/kotlin/main/"
            fi
            if [ -d "$module/classes-java-main" ]; then
              mkdir -p "modules/$name/build/classes/java/main"
              cp -R "$module/classes-java-main/." "modules/$name/build/classes/java/main/"
            fi
            if [ -d "$module/classes-kotlin-vanillaConformanceTest" ]; then
              mkdir -p "modules/$name/build/classes/kotlin/vanillaConformanceTest"
              cp -R "$module/classes-kotlin-vanillaConformanceTest/." "modules/$name/build/classes/kotlin/vanillaConformanceTest/"
            fi
            if [ -d "$module/classes-java-vanillaConformanceTest" ]; then
              mkdir -p "modules/$name/build/classes/java/vanillaConformanceTest"
              cp -R "$module/classes-java-vanillaConformanceTest/." "modules/$name/build/classes/java/vanillaConformanceTest/"
            fi
          done
          rm -rf kover-handoff

      - name: Download durations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gradle-duration-*
          path: .
          merge-multiple: true

      - name: Generate coverage reports
        uses: ./.github/actions/gradle-job
        with:
          tasks: :koverXmlReport :koverHtmlReport :koverVerify -Pkover.externalBinariesDir=modules
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Collect CI metrics
        run: bash .github/scripts/collect-ci-metrics.sh

      - name: Upload CI metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics
          path: ci-metrics.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/reports/kover
          if-no-files-found: ignore
          retention-days: 14

      - name: Download module jars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: module-jars-*
          path: module-jars
          merge-multiple: true

      - name: Upload module jars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-jars
          path: module-jars/*.jar
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage baseline cache tree
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          rm -rf .ci-baseline
          mkdir -p .ci-baseline/libs
          if [[ -f build/reports/kover/report.xml ]]; then
            cp build/reports/kover/report.xml .ci-baseline/report.xml
          fi
          if [[ -f ci-metrics.json ]]; then
            cp ci-metrics.json .ci-baseline/ci-metrics.json
          fi
          cp build/libs/kotventure-*.jar .ci-baseline/libs/ 2>/dev/null || true
          cp module-jars/kotventure-*.jar .ci-baseline/libs/ 2>/dev/null || true

      - name: Cache baseline coverage and jars for PRs
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-baseline
          key: ci-baseline-${{ github.sha }}

  dokka:
    name: Dokka
    needs: [triage]
    if: needs.triage.outputs.run == 'true' && needs.triage.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Generate Dokka
        run: ./gradlew dokkaGenerate

      - name: Upload Dokka preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dokka-preview
          path: modules/*/build/dokka/html
          if-no-files-found: warn
          retention-days: 14

  pr-feedback:
    name: PR feedback
    needs: [aggregate]
    if: >-
      always()
      && github.event_name == 'pull_request'
      && needs.aggregate.result != 'cancelled'
      && needs.aggregate.result != 'skipped'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install CI tooling dependencies
        working-directory: .github
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build CI tooling
        working-directory: .github
        run: npm run build

      - name: Restore base baseline cache
        id: base-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-baseline
          key: ci-baseline-${{ github.event.pull_request.base.sha }}
          fail-on-cache-miss: false

      - name: Materialize base paths from cache
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p base-coverage base-libs base-metrics
          if [[ -f .ci-baseline/report.xml ]]; then
            cp .ci-baseline/report.xml base-coverage/report.xml
          fi
          if [[ -f .ci-baseline/ci-metrics.json ]]; then
            cp .ci-baseline/ci-metrics.json base-metrics/ci-metrics.json
          fi
          if compgen -G '.ci-baseline/libs/kotventure-*.jar' > /dev/null; then
            cp .ci-baseline/libs/kotventure-*.jar base-libs/
          fi

      - name: Download head coverage report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: build/reports/kover

      - name: Download head module jars
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-jars
          path: pr-libs

      - name: Download head CI metrics
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-metrics
          path: head-metrics

      - name: Download base artifacts from CI run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/download-base-metrics.sh

      - name: Decide if base jar rebuild is needed
        id: need-base-jars
        continue-on-error: true
        run: |
          set -euo pipefail
          if find base-libs -name 'kotventure-*.jar' 2>/dev/null | grep -q .; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK and Gradle for base jar fallback
        if: steps.need-base-jars.outputs.needed == 'true'
        continue-on-error: true
        uses: ./.github/actions/setup-jdk-gradle
        with:
          build-scan-publish: 'false'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build base jars if still missing
        if: steps.need-base-jars.outputs.needed == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ''
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/build-base-jars.sh

      - name: Compute metrics result
        id: metrics
        continue-on-error: true
        uses: ./.github/actions/pr-metrics-comment
        with:
          head-coverage-path: build/reports/kover/report.xml
          base-coverage-path: base-coverage/report.xml
          head-libs-dir: pr-libs
          base-libs-dir: base-libs
          result-path: ${{ runner.temp }}/pr-metrics-result.json

      - name: Upload metrics result
        if: steps.metrics.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-metrics-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-metrics-result.json
          if-no-files-found: ignore
          retention-days: 1

  vanilla:
    name: Vanilla conformance
    needs: [triage]
    if: needs.triage.outputs.run == 'true' && needs.triage.outputs.vanilla == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Resolve Minecraft fixture cache key
        id: fixture
        run: .github/scripts/vanilla-fixture-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Cache Minecraft conformance fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/core/build/vanilla-conformance
          key: ${{ steps.fixture.outputs.key }}

      - name: Verify restored fixture checksum
        run: |
          set -euo pipefail
          version="${{ steps.fixture.outputs.version }}"
          expected="${{ steps.fixture.outputs.sha1 }}"
          bundle="modules/core/build/vanilla-conformance/${version}/server-${version}-bundle.jar"
          if [[ ! -f "$bundle" ]]; then
            echo "No cached server bundle at $bundle; Gradle will download and verify."
            exit 0
          fi
          actual="$(shasum -a 1 "$bundle" | awk '{ print $1 }')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Cached fixture SHA-1 mismatch (expected $expected, got $actual); removing corrupted cache entry."
            rm -f "$bundle"
            exit 0
          fi
          echo "Cached fixture SHA-1 matches $expected."

      - name: Run vanilla conformance suites
        run: ./gradlew :core:vanillaConformanceTest

      - name: Stage XML-only JUnit hand-off
        if: always()
        run: |
          set -euo pipefail
          rm -rf junit-handoff
          while IFS= read -r report; do
            target="junit-handoff/$report"
            mkdir -p "$(dirname "$target")"
            cp "$report" "$target"
          done < <(find modules -type f -path '*/build/test-results/vanillaConformanceTest/TEST-*.xml' -print)

      - name: Resolve CI workflow identity
        id: workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.workflow_id')"
          [[ "$workflow_id" =~ ^[0-9]+$ ]]
          echo "workflow_id=$workflow_id" >> "$GITHUB_OUTPUT"

      - name: Upload XML-only JUnit hand-off
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-vanilla-vanilla-${{ steps.workflow.outputs.workflow_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: junit-handoff
          if-no-files-found: ignore
          retention-days: 2

  dependencies:
    name: Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime,development,unknown

  commits:
    name: Commits
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Collect pushed commit subjects
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git log --format=%s "$HEAD_SHA" > commit-subjects.txt
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE_SHA" "$HEAD_SHA" 2>/dev/null; then
            git log --format=%s "$BEFORE_SHA..$HEAD_SHA" > commit-subjects.txt
          else
            git log --format=%s -1 "$HEAD_SHA" > commit-subjects.txt
          fi

      - name: Validate commit subjects
        run: bash .github/scripts/validate-conventional-title.sh --stdin < commit-subjects.txt

  status:
    name: Status
    if: always()
    needs: [triage, lint-kotlin, lint-actions, build, aggregate, dokka, vanilla, dependencies]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install CI tooling dependencies
        working-directory: .github
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build CI tooling
        working-directory: .github
        run: npm run build

      - name: Evaluate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRIAGE_RUN: ${{ needs.triage.outputs.run }}
          TRIAGE_RELEASE_ONLY: ${{ needs.triage.outputs.release_only }}
          TRIAGE_RELEASE_CANDIDATE: ${{ needs.triage.outputs.release_candidate }}
          TRIAGE_DOCUMENTATION_ONLY: ${{ needs.triage.outputs.documentation_only }}
          TRIAGE_CODE: ${{ needs.triage.outputs.code }}
          TRIAGE_VANILLA: ${{ needs.triage.outputs.vanilla }}
          TRIAGE_RESULT: ${{ needs.triage.result }}
          LINT_KOTLIN_RESULT: ${{ needs.lint-kotlin.result }}
          LINT_ACTIONS_RESULT: ${{ needs.lint-actions.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          DOKKA_RESULT: ${{ needs.dokka.result }}
          VANILLA_RESULT: ${{ needs.vanilla.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
        with:
          script: |
            const { evaluateCiStatus } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-status.js`);

            try {
              const evaluation = evaluateCiStatus({
                eventName: context.eventName,
                triage: {
                  run: process.env.TRIAGE_RUN,
                  releaseOnly: process.env.TRIAGE_RELEASE_ONLY,
                  releaseCandidate: process.env.TRIAGE_RELEASE_CANDIDATE,
                  documentationOnly: process.env.TRIAGE_DOCUMENTATION_ONLY,
                  code: process.env.TRIAGE_CODE || undefined,
                  vanilla: process.env.TRIAGE_VANILLA || undefined,
                },
                results: {
                  triage: process.env.TRIAGE_RESULT,
                  lintKotlin: process.env.LINT_KOTLIN_RESULT,
                  lintActions: process.env.LINT_ACTIONS_RESULT,
                  build: process.env.BUILD_RESULT,
                  aggregate: process.env.AGGREGATE_RESULT,
                  dokka: process.env.DOKKA_RESULT,
                  vanilla: process.env.VANILLA_RESULT,
                  dependencies: process.env.DEPENDENCIES_RESULT,
                },
              });
              core.notice(evaluation.summary);
            } catch (error) {
              core.setFailed(error instanceof Error ? error.message : String(error));
            }
