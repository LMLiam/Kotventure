name: Qodana publication

on:
  workflow_run:
    workflows: [Qodana]
    types: [completed]

permissions: {}

concurrency:
  group: qodana-publication-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --use-system-ca

jobs:
  publish:
    name: Publish Qodana result
    if: github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout trusted publication code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install CI tooling dependencies
        working-directory: .github
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build CI tooling
        working-directory: .github
        run: npm run build

      - name: Validate the current Qodana source
        id: publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { writePublicationOutputs } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/qodana-publisher.js`);
            await writePublicationOutputs({ github, context, core });

      - name: Download and validate the Qodana SARIF
        id: download
        if: steps.publication.outputs.publish == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ steps.publication.outputs.artifact_id }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/qodana-publication
          GITHUB_TOKEN: ${{ github.token }}
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { downloadQodanaArtifact } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/qodana-publisher-storage.js`);
            const filePath = await downloadQodanaArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifactId: Number(process.env.ARTIFACT_ID),
              outputDirectory: process.env.OUTPUT_DIRECTORY,
              token: process.env.GITHUB_TOKEN,
            });
            core.setOutput('path', filePath);

      - name: Normalize Qodana SARIF regions
        if: steps.publication.outputs.publish == 'true'
        shell: bash
        env:
          SARIF_PATH: ${{ steps.download.outputs.path }}
        run: bash .github/scripts/normalize-qodana-sarif.sh "$SARIF_PATH"

      - name: Verify the SARIF upload root is not a Git worktree
        if: steps.publication.outputs.publish == 'true'
        shell: bash
        env:
          UPLOAD_ROOT: ${{ runner.temp }}/qodana-publication
        run: |
          set -euo pipefail
          if [[ ! -d $UPLOAD_ROOT ]]; then
            printf 'SARIF upload root does not exist: %s\n' "$UPLOAD_ROOT" >&2
            exit 1
          fi
          if git -C "$UPLOAD_ROOT" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            printf 'SARIF upload root must not be in a Git worktree: %s\n' "$UPLOAD_ROOT" >&2
            exit 1
          fi

      - name: Upload Qodana results to code scanning
        if: steps.publication.outputs.publish == 'true'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/ci.yml:qodana
        with:
          sarif_file: ${{ steps.download.outputs.path }}
          checkout_path: ${{ runner.temp }}/qodana-publication
          ref: refs/pull/${{ steps.publication.outputs.pull_number }}/head
          sha: ${{ steps.publication.outputs.head_sha }}
          category: Kotventure/qodana
