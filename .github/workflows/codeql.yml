name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  merge_group:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      release_only: ${{ steps.decide.outputs.release_only }}
      release_candidate: ${{ steps.decide.outputs.release_candidate }}
      documentation_only: ${{ steps.decide.outputs.documentation_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install CI tooling dependencies
        working-directory: .github
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build CI tooling
        working-directory: .github
        run: npm run build

      - name: Decide whether heavy CI should run
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { decideGate } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-gate.js`);
            await decideGate({ github, context, core });

  changes:
    name: Detect changes
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.resolve.outputs.code }}
      vanilla: ${{ steps.resolve.outputs.vanilla }}
      documentation_only: ${{ steps.resolve.outputs.documentation_only }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Path filter
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'modules/**'
              - 'gradle/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'buildSrc/**'
              - '.editorconfig'
              - '.gitattributes'
              - '.gitignore'
              - 'qodana.yaml'
              - 'jitpack.yml'
              - 'release-please-config.json'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/dependabot.yml'
              - '.github/package.json'
              - '.github/package-lock.json'
              - '.github/tsconfig*.json'
            vanilla:
              - 'modules/core/**'
              - 'gradle/vanilla-conformance.gradle'
              - 'buildSrc/**'
              - '.github/scripts/vanilla-fixture-cache-key.sh'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-jdk-gradle/**'

      - name: Resolve flags
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          FILTER_VANILLA: ${{ steps.filter.outputs.vanilla }}
          RELEASE_CANDIDATE: ${{ needs.gate.outputs.release_candidate }}
          DOCUMENTATION_ONLY: ${{ needs.gate.outputs.documentation_only }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$RELEASE_CANDIDATE" == "true" ]]; then
            {
              echo "code=true"
              echo "vanilla=true"
              echo "documentation_only=false"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$DOCUMENTATION_ONLY" == "true" ]]; then
              {
                echo "code=false"
                echo "vanilla=false"
                echo "documentation_only=true"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "code=true"
                echo "vanilla=${FILTER_VANILLA}"
                echo "documentation_only=false"
              } >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            {
              echo "code=${FILTER_CODE}"
              echo "vanilla=${FILTER_VANILLA}"
              echo "documentation_only=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "code=true"
              echo "vanilla=true"
              echo "documentation_only=false"
            } >> "$GITHUB_OUTPUT"
          fi

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: [gate, changes]
    if: >-
      needs.gate.outputs.run == 'true'
      && needs.changes.outputs.code == 'true'
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up JDK and Gradle
        if: matrix.build-mode == 'manual'
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build for CodeQL
        if: matrix.build-mode == 'manual'
        run: >-
          ./gradlew classes testClasses -x test -Pkotlin.incremental=false
          -Pkotlin.daemon.jvmargs=-Xmx4g --no-build-cache --rerun-tasks

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          upload-database: false
          post-processed-sarif-path: ${{ runner.temp }}/codeql-sarif

      - name: Stage CodeQL SARIF hand-off
        if: always()
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-sarif
        run: |
          set -euo pipefail
          rm -rf codeql-handoff
          mkdir -p codeql-handoff
          if [[ ! -d "$SARIF_DIRECTORY" ]]; then
            echo "CodeQL SARIF directory is missing; the analysis did not complete" >&2
            exit 0
          fi
          mapfile -t sarif_files < <(find "$SARIF_DIRECTORY" -type f -name '*.sarif' -print)
          if [[ "${#sarif_files[@]}" -ne 1 ]]; then
            echo "Expected one post-processed CodeQL SARIF file, found ${#sarif_files[@]}" >&2
            exit 1
          fi
          cp "${sarif_files[0]}" codeql-handoff/codeql.sarif

      - name: Resolve CodeQL workflow identity
        id: workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.workflow_id')"
          [[ "$workflow_id" =~ ^[0-9]+$ ]]
          echo "workflow_id=$workflow_id" >> "$GITHUB_OUTPUT"

      - name: Upload CodeQL SARIF hand-off
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ steps.workflow.outputs.workflow_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: codeql-handoff/codeql.sarif
          if-no-files-found: ignore
          retention-days: 2

  codeql-trusted:
    name: CodeQL trusted (${{ matrix.language }})
    needs: [gate, changes]
    if: >-
      needs.gate.outputs.run == 'true'
      && needs.changes.outputs.code == 'true'
      && github.event_name != 'pull_request'
      && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up JDK and Gradle
        if: matrix.build-mode == 'manual'
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build for CodeQL
        if: matrix.build-mode == 'manual'
        run: >-
          ./gradlew classes testClasses -x test -Pkotlin.incremental=false
          -Pkotlin.daemon.jvmargs=-Xmx4g --no-build-cache --rerun-tasks

      - name: Perform trusted CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:${{ matrix.language }}"
