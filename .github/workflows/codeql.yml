name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  merge_group:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      release_only: ${{ steps.decide.outputs.release_only }}
      release_candidate: ${{ steps.decide.outputs.release_candidate }}
      documentation_only: ${{ steps.decide.outputs.documentation_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install CI tooling dependencies
        working-directory: .github
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build CI tooling
        working-directory: .github
        run: npm run build

      - name: Decide whether heavy CI should run
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { decideGate } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-gate.js`);
            await decideGate({ github, context, core });

  changes:
    name: Detect changes
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jvm: ${{ steps.resolve.outputs.jvm }}
      tooling: ${{ steps.resolve.outputs.tooling }}
      vanilla: ${{ steps.resolve.outputs.vanilla }}
      documentation_only: ${{ steps.resolve.outputs.documentation_only }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Path filter
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            jvm:
              - 'modules/**'
              - 'gradle/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'buildSrc/**'
              - '.editorconfig'
              - '.gitattributes'
              - '.gitignore'
              - 'qodana.yaml'
              - 'jitpack.yml'
              - 'release-please-config.json'
            tooling:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/dependabot.yml'
              - '.github/package.json'
              - '.github/package-lock.json'
              - '.github/tsconfig*.json'
            vanilla:
              - 'modules/core/**'
              - 'gradle/vanilla-conformance.gradle'
              - 'buildSrc/**'
              - '.github/scripts/vanilla-fixture-cache-key.sh'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-jdk-gradle/**'
              - '.github/actions/publish-junit-report/**'

      - name: Resolve flags
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_JVM: ${{ steps.filter.outputs.jvm }}
          FILTER_TOOLING: ${{ steps.filter.outputs.tooling }}
          FILTER_VANILLA: ${{ steps.filter.outputs.vanilla }}
          RELEASE_CANDIDATE: ${{ needs.gate.outputs.release_candidate }}
          DOCUMENTATION_ONLY: ${{ needs.gate.outputs.documentation_only }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$RELEASE_CANDIDATE" == "true" ]]; then
            {
              echo "jvm=true"
              echo "tooling=true"
              echo "vanilla=true"
              echo "documentation_only=false"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$DOCUMENTATION_ONLY" == "true" ]]; then
              {
                echo "jvm=false"
                echo "tooling=false"
                echo "vanilla=false"
                echo "documentation_only=true"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "jvm=${FILTER_JVM}"
                echo "tooling=${FILTER_TOOLING}"
                echo "vanilla=${FILTER_VANILLA}"
                echo "documentation_only=false"
              } >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            {
              echo "jvm=${FILTER_JVM}"
              echo "tooling=${FILTER_TOOLING}"
              echo "vanilla=${FILTER_VANILLA}"
              echo "documentation_only=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "jvm=true"
              echo "tooling=true"
              echo "vanilla=true"
              echo "documentation_only=false"
            } >> "$GITHUB_OUTPUT"
          fi

  codeql-actions:
    name: CodeQL (actions)
    needs: [gate, changes]
    if: needs.gate.outputs.run == 'true' && needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:actions"

  codeql-java-kotlin:
    name: CodeQL (java-kotlin)
    needs: [gate, changes]
    if: needs.gate.outputs.run == 'true' && needs.changes.outputs.jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build for CodeQL
        run: >-
          ./gradlew classes testClasses -x test -Pkotlin.incremental=false
          -Pkotlin.daemon.jvmargs=-Xmx4g --no-build-cache --rerun-tasks

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:java-kotlin"
