name: Qodana trusted

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: qodana-trusted-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --use-system-ca

jobs:
  analyse:
    name: Qodana trusted ref
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout the trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Restore Gradle caches for the linter
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      - name: Scan the trusted source with Qodana
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          args: >-
            --project-dir source
            --config qodana.yaml
          github-token: ${{ github.token }}
          pr-mode: false
          upload-result: false
          use-annotations: false
          post-pr-comment: false
          push-fixes: none
          use-caches: true
        env:
          QODANA_REVISION: ${{ github.sha }}

      - name: Normalize Qodana SARIF regions
        shell: bash
        run: bash .github/scripts/normalize-qodana-sarif.sh "${{ runner.temp }}/qodana/results/qodana.sarif.json"

      - name: Upload Qodana results to code scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/ci.yml:qodana
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          checkout_path: source
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
          category: Kotventure/qodana
