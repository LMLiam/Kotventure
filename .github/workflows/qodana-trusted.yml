name: Qodana trusted

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: qodana-trusted-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Qodana trusted ref
    if: >-
      (
        github.event.workflow_run.event == 'push'
        || github.event.workflow_run.event == 'schedule'
        || github.event.workflow_run.event == 'workflow_dispatch'
      )
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve the completed trusted CI source
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { resolveTrustedCiRun } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/qodana-source.js`);
            const source = await resolveTrustedCiRun({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              runId: context.payload.workflow_run.id,
              eventRun: context.payload.workflow_run,
            });
            core.setOutput('head_sha', source.headSha);

      - name: Checkout the validated trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.source.outputs.head_sha }}
          path: source
          persist-credentials: false

      - name: Scan the trusted source with Qodana
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          args: >-
            --project-dir source
            --config qodana.yaml
          github-token: ${{ github.token }}
          pr-mode: false
          upload-result: false
          use-annotations: false
          post-pr-comment: false
          push-fixes: none
          use-caches: false
        env:
          QODANA_REVISION: ${{ steps.source.outputs.head_sha }}

      - name: Normalize Qodana SARIF regions
        shell: bash
        run: bash .github/scripts/normalize-qodana-sarif.sh "${{ runner.temp }}/qodana/results/qodana.sarif.json"

      - name: Upload Qodana results to code scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/ci.yml:qodana
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          checkout_path: source
          ref: refs/heads/${{ github.event.repository.default_branch }}
          sha: ${{ steps.source.outputs.head_sha }}
          category: Kotventure/qodana
