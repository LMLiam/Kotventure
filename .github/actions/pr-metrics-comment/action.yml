name: PR Metrics Result
description: Compute a bounded PR metrics result for trusted publication.

inputs:
  head-coverage-path:
    description: Path to head Kover XML report.
    required: false
    default: 'build/reports/kover/report.xml'
  base-coverage-path:
    description: Path to base Kover XML report (optional; absolute coverage only if missing).
    required: false
    default: 'base-coverage/report.xml'
  head-libs-dir:
    description: Directory tree of head module JARs.
    required: false
    default: 'pr-libs'
  base-libs-dir:
    description: Directory tree of base module JARs.
    required: false
    default: 'base-libs'
  head-metrics-path:
    description: Path to head ci-metrics.json (tests, duration).
    required: false
    default: 'head-metrics/ci-metrics.json'
  base-metrics-path:
    description: Path to base ci-metrics.json.
    required: false
    default: 'base-metrics/ci-metrics.json'
  result-path:
    description: Path for the bounded metrics result JSON file.
    required: true

runs:
  using: composite
  steps:
    - name: Compute metrics result
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        HEAD_COVERAGE_PATH: ${{ inputs.head-coverage-path }}
        BASE_COVERAGE_PATH: ${{ inputs.base-coverage-path }}
        HEAD_LIBS_DIR: ${{ inputs.head-libs-dir }}
        BASE_LIBS_DIR: ${{ inputs.base-libs-dir }}
        HEAD_METRICS_PATH: ${{ inputs.head-metrics-path }}
        BASE_METRICS_PATH: ${{ inputs.base-metrics-path }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        OUTPUT_PATH: ${{ inputs.result-path }}
      with:
        script: |
          const run = require(`${process.env.ACTION_PATH}/lib/main.js`);
          await run({ github, context, core });
