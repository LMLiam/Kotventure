name: Setup JDK and Gradle
description: Install Temurin JDK and configure the Gradle action (dependency/build caches, optional Build Scan).

inputs:
  java-version:
    description: JDK version for setup-java (matches the project toolchain by default).
    required: false
    default: '25'
  build-scan-publish:
    description: Publish a Gradle Build Scan (Develocity injection). Off by default — turns off local build-cache hits.
    required: false
    default: 'false'
  cache-encryption-key:
    description: Base64 AES key that encrypts the Gradle configuration cache for save/restore.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Set up Gradle (with Build Scan)
      if: inputs.build-scan-publish == 'true'
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        build-scan-publish: true
        build-scan-terms-of-use-url: https://gradle.com/terms-of-service
        build-scan-terms-of-use-agree: 'yes'
        cache-encryption-key: ${{ inputs.cache-encryption-key }}

    - name: Set up Gradle
      if: inputs.build-scan-publish != 'true'
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
